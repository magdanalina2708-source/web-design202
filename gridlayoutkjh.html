<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid_con{
            display: grid;
            grid-template-areas: 
            "header header header"
            " menu main right"
            "footer footer footer";
            grid-gap: 10px;
        }
        .header{
            grid-area: header;
        }
        .menu{
            grid-area: menu;
        }
        .main{
            grid-area: main;
        }
        .right{
            grid-area: right;
        }
        .footer{
            grid-area: footer;
        }
        .grid_con div{
            background-color: aqua;
            align-items: center;
            font-size: 20px;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="grid_con">
        <div class="header">Header </div>
        <div class="menu">Menu</div>
        <div class="main">Main </div>
        <div class="right">Right</div>
        <div class="footer">Footer</div>   
     </div>
</body>
</html>
