<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox Layout</title>
    <style>
        .header,
        .footer{
            background-color: rgb(122, 122, 122);
            color: whitesmoke;
            text-align: center;
            padding: 1em;
        }
        .nav {
            background-color: rgb(151, 151, 151);
            padding: 1em;
            display: flex;
            justify-content: space-around;
        }
        .nav a {
            color: black;
            text-decoration: none;
        }
        .main {
            display: flex;
            flex-direction: row;
            margin: 1em 0;
        }
        .sidebar {
            background-color: rgb(255, 255, 255);
            padding: 1em;
            width: 20%;
        }
        .content {
            background-color: rgb(204, 204, 204);
            padding: 1em;
            width: 80%;
        }
    </style>

</head>
<body>
    <div class="header">Бизнес-школа</div>
    <div class="nav">
        <a href="a">Home</a>
        <a href="a">About</a>
        <a href="a">Services</a>
        <a href="a">Contact</a>
    </div>
    <div class="main">
        <div class="sidebar">Sidebar</div>
        <div class="content">Main Content </div>

        </div>
        <div class="footer">Спасибо что выбрали нас</div>
    </div>
</body>
</html>
